<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CODEX giúp giảng viên phát hiện đạo văn mã nguồn, phân loại code do AI sinh, so sánh bài nộp và xuất báo cáo."
    />
    <meta name="theme-color" content="#f6f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CODEX — Chống đạo văn học thuật" />
    <meta property="og:description" content="Phát hiện đạo văn mã nguồn, phân loại code AI và so sánh bài nộp trong một giao diện thống nhất." />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:image" content="/favicon.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>CODEX — Chống đạo văn học thuật</title>
    <script>
      // Áp theme trước khi React render để tránh nháy trắng.
      (function () {
        try {
          var saved = localStorage.getItem("codex.theme.v1");
          var dark =
            saved === "dark" ||
            ((saved === "system" || !saved) &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
